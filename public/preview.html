<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            width: 90%;
            text-align: center;
        }
        video {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            background: #000;
        }
        h1 {
            margin-bottom: 24px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cinematic Hero Video Preview</h1>
        <video controls autoplay loop muted playsinline>
            <source src="/videos/ai-receptionist-cinematic.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
</body>
</html>
